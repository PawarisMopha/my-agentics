# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # 1. สำหรับ GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # 2. สำหรับ Python (รองรับ requirements.txt, pyproject.toml, Pipfile)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # 3. สำหรับ JavaScript / TypeScript (รองรับ package.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # 4. สำหรับ Golang (รองรับ go.mod)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"

  # 5. สำหรับ Gradle (รองรับ build.gradle, build.gradle.kts)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
