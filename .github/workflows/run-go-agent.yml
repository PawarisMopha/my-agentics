name: Run Go Agent (main.go)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write # อนุญาตให้ Agent บันทึกไฟล์สรุปกลับเข้า Repo ได้

jobs:
  run-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Download dependencies
        run: go mod download

      - name: Run main.go
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: go run main.go

      - name: Commit generated summary file
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update agent summary report"
          git push
